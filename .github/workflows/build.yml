name: Build Aseprite
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Install Build Tools
        run: choco install cmake ninja innosetup -y --no-progress

      - name: Fetch Latest Release Metadata
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{}
          if ($env:GH_TOKEN) { $headers["Authorization"] = "token $env:GH_TOKEN" }
          $resp = (Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri https://api.github.com/repos/aseprite/aseprite/releases/latest -ErrorAction Stop).Content | ConvertFrom-Json
          $asset = $resp.assets | Where-Object { $_.name -like "*Source.zip" } | Select-Object -First 1
          if (-not $asset) {
              $asset = $resp.assets | Select-Object -First 1
          }
          echo "DOWNLOAD_URL=$($asset.browser_download_url)" >> $env:GITHUB_ENV
          echo "ASE_VER=$($resp.tag_name)" >> $env:GITHUB_ENV
          echo "Detected Aseprite version: $($resp.tag_name)"
          echo "Source asset: $($asset.name)"

      - name: Download & Extract Source
        shell: powershell
        run: |
          Invoke-WebRequest -Uri ${{ env.DOWNLOAD_URL }} -OutFile "aseprite_src.zip" -UseBasicParsing
          Expand-Archive -Force "aseprite_src.zip" "temp_ext"
          $rootFile = Get-ChildItem -Path "temp_ext" -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
          mkdir aseprite -Force
          Get-ChildItem -Path "$($rootFile.Directory.FullName)\*" | Move-Item -Destination "aseprite" -Force
          Write-Host "Source extracted successfully"

      - name: Download & Extract Skia
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" -OutFile "skia.zip" -UseBasicParsing
          mkdir skia -Force
          Expand-Archive -Force "skia.zip" "skia"
          Write-Host "Skia extracted successfully"

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run CMake Configuration
        shell: powershell
        run: |
          $abs_src = Join-Path $env:GITHUB_WORKSPACE "aseprite"
          $abs_skia = Join-Path $env:GITHUB_WORKSPACE "skia"
          $abs_build = Join-Path $env:GITHUB_WORKSPACE "build"
          mkdir $abs_build -Force
          Set-Location $abs_build
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$abs_skia" `
            -DSKIA_LIBRARY_DIR="$abs_skia\out\Release-x64" `
            -DSKIA_LIBRARY="$abs_skia\out\Release-x64\skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF `
            "$abs_src"
          if ($LASTEXITCODE -ne 0) {
              throw "CMake configuration failed"
          }
          Write-Host "CMake configuration completed successfully"

      - name: Compile with Ninja
        run: |
          cd build
          $cpuCount = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $jobs = [math]::Min($cpuCount * 2, 8)
          Write-Host "Using $jobs parallel compilation jobs"
          ninja -j $jobs

      - name: Collect Dependencies (DLLs)
        shell: powershell
        run: |
          $binDir = "$env:GITHUB_WORKSPACE\build\bin"
          $sslDir = "C:\Program Files\OpenSSL\bin"
          if (Test-Path "$sslDir\libcrypto-3-x64.dll") {
              Copy-Item "$sslDir\libcrypto-3-x64.dll" -Destination $binDir -Force
              Copy-Item "$sslDir\libssl-3-x64.dll" -Destination $binDir -Force
              echo "[+] DLLs copied to $binDir"
          } else {
              echo "[!] OpenSSL DLLs not found - skipping"
          }

      - name: Package Installer (Inno Setup)
        shell: powershell
        run: |
          $binPath = Join-Path $env:GITHUB_WORKSPACE "build\bin"
          $iss = @"
          [Setup]
          AppName=Aseprite
          AppVersion=${{ env.ASE_VER }}
          DefaultDirName={autopf}\Aseprite
          DefaultGroupName=Aseprite
          OutputBaseFilename=aseprite-setup
          OutputDir=installer
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "$binPath\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Aseprite"; Filename: "{app}\aseprite.exe"
          "@
          mkdir installer -Force
          $iss | Out-File -FilePath "aseprite.iss" -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" aseprite.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.ASE_VER }}
          name: Aseprite ${{ env.ASE_VER }}
          files: installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Installer
          path: installer/*.exe
